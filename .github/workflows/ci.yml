name: CI

on:
  push:
    branches:
      - main
      - refactor/security-architecture-business
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint refactored core
        run: >
          npx eslint
          src/lib/auth.ts
          src/lib/api.ts
          src/lib/actions.ts
          src/lib/rate-limit.ts
          src/lib/db.ts
          src/lib/tutor-data.ts
          src/app/api/auth/general/route.ts
          src/app/api/leads/route.ts
          src/app/api/payments/route.ts
          src/app/api/tutor/profile/route.ts
          src/components/LoginForm.tsx
          src/components/RegisterForm.tsx
          src/components/MatchingIntakeForm.tsx
          src/app/register/page.tsx
          src/app/onboarding/matching/page.tsx
          --rule "@typescript-eslint/no-explicit-any: off"

      - name: Typecheck
        run: npx tsc --noEmit
